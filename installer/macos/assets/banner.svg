<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1240" viewBox="0 0 620 620">
  <!-- The panel's top bar (dark surface token #1a1920, logo, name, accent pill), centred on a square canvas: qlmanage renders squares and build.sh crops the middle 160 px. -->
  <g transform="translate(0,270)">
    <rect width="620" height="80" fill="#1a1920"/>
    <rect y="79" width="620" height="1" fill="#2c2b34"/>
    <rect x="28" y="22" width="36" height="36" rx="10" fill="#6e1fff"/>
    <text x="46" y="46.5" text-anchor="middle" font-family="-apple-system, Helvetica Neue, Arial" font-weight="800" font-size="18" fill="#fff">F</text>
    <text x="78" y="46.5" font-family="-apple-system, Helvetica Neue, Arial" font-weight="700" font-size="19" fill="#fff">Fyso</text>
    <rect x="134" y="30" width="78" height="20" rx="10" fill="#2b1b57"/>
    <text x="173" y="44" text-anchor="middle" font-family="Menlo, monospace" font-weight="700" font-size="10.5" fill="#a57bff">installer</text>
  </g>
</svg>
