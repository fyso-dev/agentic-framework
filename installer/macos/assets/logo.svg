<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 28 28">
  <!-- The panel's logo mark (framework/panel: .logo, accent token #6e1fff), full bleed:
       macOS rounds app icons itself. A pre-rounded square does not match its mask, and
       macOS 26 then shows it shrunk on a grey plate. -->
  <rect width="28" height="28" fill="#6e1fff"/>
  <text x="14" y="19" text-anchor="middle" font-family="-apple-system, Helvetica Neue, Arial" font-weight="800" font-size="14" fill="#fff">F</text>
</svg>
