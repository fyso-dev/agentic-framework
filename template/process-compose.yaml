# Native processes of this project (PLAN D1). Started by `mise run up`.
# Each script clears its environment and passes only what that process needs.
version: "0.5"
log_location: .data/logs/process-compose.log
log_level: info

processes:
  web-auth:
    command: framework/scripts/run-web-auth.sh
    log_location: .data/logs/web-auth.log
    readiness_probe:
      exec:
        command: framework/scripts/health.sh web-auth
      initial_delay_seconds: 1
      period_seconds: 2
      timeout_seconds: 10
      failure_threshold: 20
    availability:
      restart: always
      backoff_seconds: 3

  dagu:
    command: framework/scripts/run-dagu.sh
    log_location: .data/logs/dagu.log
    readiness_probe:
      exec:
        command: framework/scripts/health.sh dagu
      initial_delay_seconds: 2
      period_seconds: 3
      timeout_seconds: 10
      failure_threshold: 20
    availability:
      restart: always
      backoff_seconds: 3

  omb:
    command: framework/scripts/run-omb.sh
    log_location: .data/logs/omb.log
    readiness_probe:
      exec:
        command: framework/scripts/health.sh omb
      initial_delay_seconds: 5
      period_seconds: 3
      timeout_seconds: 10
      failure_threshold: 60
    availability:
      restart: always
      backoff_seconds: 5

  connector-setup:
    command: framework/scripts/run-composio-setup.sh
    log_location: .data/logs/connector-setup.log
    readiness_probe:
      exec:
        command: framework/scripts/health.sh connector-setup
      initial_delay_seconds: 1
      period_seconds: 2
      timeout_seconds: 10
    availability:
      restart: always
      backoff_seconds: 3

  # Remote MCP endpoint (D63). It answers "off" until the project has an HTTPS
  # provider extension and a token (mise run agent:remote).
  mcp-remote:
    command: framework/scripts/run-mcp-remote.sh
    log_location: .data/logs/mcp-remote.log
    readiness_probe:
      exec:
        command: framework/scripts/health.sh mcp-remote
      initial_delay_seconds: 1
      period_seconds: 2
      timeout_seconds: 10
    availability:
      restart: always
      backoff_seconds: 3

  caddy:
    command: framework/scripts/run-caddy.sh
    log_location: .data/logs/caddy.log
    depends_on:
      connector-setup:
        condition: process_healthy
      web-auth:
        condition: process_healthy
      dagu:
        condition: process_healthy
      omb:
        condition: process_healthy
    readiness_probe:
      exec:
        command: framework/scripts/health.sh caddy
      initial_delay_seconds: 1
      period_seconds: 2
      timeout_seconds: 10
      failure_threshold: 15
    availability:
      restart: always
      backoff_seconds: 3
