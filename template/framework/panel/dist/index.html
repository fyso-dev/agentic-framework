<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Fyso</title>
    <link rel="icon" type="image/png" href="./assets/fyso-mark.png" />
    <script>
      // Apply the theme before first paint (same keys as src/lib/theme.ts).
      (function () {
        try {
          var q = new URLSearchParams(location.search).get("theme");
          var t = q === "light" || q === "dark" ? q : localStorage.getItem("fyso.theme");
          if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.className = "fy-" + t;
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="./assets/index.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/botRoster.js">
    <link rel="stylesheet" crossorigin href="./assets/panel.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
