name: fyso-bots-apply
description: Panel bots-apply
labels:
  - fyso=system
type: graph
max_active_runs: 1
params:
  - TEAM_B64: ""
  - TEAM_BASE_B64: ""
  - REMOVAL_REVISION: ""
env:
  - ROOT: ${FYSO_ROOT}
working_dir: ${ROOT}
steps:
  - id: snapshot_bots
    command: framework/scripts/snapshot.sh bots
  - id: snapshot_memory
    command: framework/scripts/snapshot.sh memory
    depends: [snapshot_bots]
  - id: snapshot_commit
    command: framework/scripts/snapshot.sh commit
    depends: [snapshot_memory]
  - id: apply
    command: framework/scripts/panel-actions.sh apply
    depends: [snapshot_commit]
    output: APPLY
