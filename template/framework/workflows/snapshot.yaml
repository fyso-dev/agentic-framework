# Save bots, memory and workflows to git (PLAN §6, D5). Hourly and on demand.
# Owned by the framework; project/workflows/fyso-snapshot.yaml links here.
description: Save bots, memory and workflows to git
type: graph
schedule: "0 * * * *"
max_active_runs: 1
env:
  - ROOT: ${FYSO_ROOT}
working_dir: ${ROOT}
steps:
  - id: bots
    command: framework/scripts/snapshot.sh bots
    # OpenMausBot may still be starting (e.g. a scheduled run right after `up`).
    retry_policy:
      limit: 6
      interval_sec: 20
  - id: memory
    command: framework/scripts/snapshot.sh memory
    depends: [bots]
  - id: commit
    command: framework/scripts/snapshot.sh commit
    depends: [memory]
    output: RESULT
