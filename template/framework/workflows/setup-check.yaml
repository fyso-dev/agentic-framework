name: fyso-setup-check
description: Panel setup-check
labels:
  - fyso=system
type: graph
# Checks read into a per-run temporary directory and regenerate .mcp.json atomically
# from the same inputs. Runs may overlap, so the panel starts them at once (D80).
max_active_runs: 4
env:
  - ROOT: ${FYSO_ROOT}
working_dir: ${ROOT}
steps:
  - id: check
    command: framework/scripts/panel-actions.sh check
    output: CHECK
