name: fyso-ext-install
description: Install, upgrade or resume activation of a project extension
labels:
  - fyso=system
type: graph
max_active_runs: 1
params:
  - ID: ""
  - MODE: add
env:
  - ROOT: ${FYSO_ROOT}
  - MISE_SOPS_AGE_KEY_FILE: ${FYSO_COMPOSIO_AGE_KEY_FILE}
working_dir: ${ROOT}
steps:
  # mise exec: Dagu steps start from a cleared environment (ports, secrets, tools).
  # MODE and ID reach the script as env vars, never through the shell command line.
  - id: install
    command: mise exec -- framework/scripts/ext.sh apply
    output: RESULT
