name: fyso-ext-install
description: Panel ext-install (install or upgrade one extension from the marketplace, D31)
labels:
  - fyso=system
type: graph
max_active_runs: 1
params:
  - ID: ""
  - MODE: add
env:
  - ROOT: ${FYSO_ROOT}
working_dir: ${ROOT}
steps:
  # mise exec: Dagu steps start from a cleared environment (ports, secrets, tools).
  # MODE and ID reach the script as env vars, never through the shell command line.
  - id: install
    command: mise exec -- framework/scripts/ext.sh apply
    output: RESULT
