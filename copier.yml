# Copier template for a Fyso Agentic Framework project.
# Create:  uvx copier copy --trust gh:fyso-dev/agentic-framework my-project
# Update:  uvx copier update --trust
_min_copier_version: "9.4.0"
_subdirectory: template
_answers_file: .copier-answers.yml
_templates_suffix: .jinja
_preserve_symlinks: true
# Copier's default exclusions, plus the panel's local Node install (dist/ is committed).
_exclude:
  - "copier.yaml"
  - "copier.yml"
  # Bundled extensions keep their own Copier configuration (the starter and each opt-in extension).
  - "!framework/extensions/*/copier.yml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
  - "node_modules"

# Files owned by the project: created once, never overwritten by `copier update`.
_skip_if_exists:
  - "project/**"
  - "state/**"
  - ".sops.yaml"
  - "secrets.enc.yaml"

_message_after_copy: |
  Project created in {{ _copier_conf.dst_path }}.

  Next steps:
    cd {{ _copier_conf.dst_path }}
    git init -b main
    git add .
    git commit -m "chore: initialize Fyso project"
    mise trust && mise install
    mise run setup      # encryption key + secrets file; choose a local login password
    mise run up         # Dagu, OpenMausBot and Caddy

  Then open http://panel.localhost:{{ port_base }}

project_name:
  type: str
  help: Project name (shown in the panel)
  default: Fyso project

project_slug:
  type: str
  help: Short identifier (lowercase, digits, dashes)
  default: "{{ project_name | lower | replace(' ', '-') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9-]{1,30}$')) %}
    Use 2-31 lowercase letters, digits or dashes, starting with a letter.
    {% endif %}

port_base:
  type: int
  help: >-
    First port of this project's block of 10 (PLAN §3.1). Pick a block not used
    by another project. Never 8799/18799/28799 (OpenMausBot desktop) or 8080.
  default: 8400
  validator: >-
    {% if port_base < 1024 or port_base > 65520 or port_base % 10 != 0 %}
    Use a multiple of 10 between 1030 and 65520.
    {% endif %}

admin_user:
  type: str
  help: Initial local web administrator (credentials live in secrets.enc.yaml)
  default: admin
  validator: >-
    {% if not (admin_user | regex_search('^[a-zA-Z][a-zA-Z0-9_.-]{1,63}$')) %}
    Use 2-64 ASCII letters, digits, dots, dashes or underscores, starting with a letter.
    {% endif %}

web_domain:
  type: str
  help: >-
    Domain of this project's web addresses (panel.<domain>, dagu.<domain>, …).
    Leave empty for the local default, <slug>-<port>.localhost. Any other name
    must resolve to this host on a private network; the gateway stays on loopback (D61).
  default: ""
  validator: >-
    {% if web_domain == 'localhost' %}
    localhost is reserved for legacy redirects; use a project-specific DNS name or leave it empty.
    {% elif web_domain and not (web_domain | regex_search('^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$')) %}
    Use a lowercase DNS name without scheme or port, or leave it empty.
    {% endif %}

auth_upstream:
  type: str
  help: >-
    Shared web login. Leave empty and this project runs its own login (default).
    To sign in once for several projects on this host, give the loopback address
    of the login service they share, for example 127.0.0.1:8489 (D61).
  default: ""
  validator: >-
    {% if auth_upstream and not (auth_upstream | regex_search('^127\.0\.0\.1:[0-9]{2,5}$')) %}
    Use 127.0.0.1:<port>, or leave it empty.
    {% endif %}

engine:
  type: str
  help: >-
    Coding engine this host is signed in to. Bots and fyso-dev-task use it by
    default; the other engine stays optional (PLAN D30).
  choices:
    Claude Code (claude login): claude
    Codex (codex login): codex
  default: claude
